<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Staff sign-in - AppContributor</title>
    <link rel="icon" type="image/png" href="../assets/brand/brand-mark.png?v=2" />
    <link rel="shortcut icon" href="../assets/brand/brand-mark.png?v=2" />
    <link rel="apple-touch-icon" href="../assets/brand/brand-mark.png?v=2" />
    <link rel="stylesheet" href="../css/styles.css?v=13" />
  </head>
  <body>
    <header class="navbar">
      <div id="brand-link" class="brand-box">
        <img class="brand-logo-image" src="../assets/brand/brand-mark.png?v=2" alt="AppContributor logo" />
        <div class="brand-text">
          <strong>AppContributor</strong>
          <span class="brand-version-chip">BETA</span>
        </div>
      </div>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="../index.html">Back to site</a>
      </div>
    </header>

    <main>
      <section class="section onboarding-section">
        <div class="onboarding-intro">
          <h2>Staff sign-in</h2>
          <span class="section-note"
            >Bookmark this page for platform operators. It is not linked from the public site. Admin signup requires a
            server-configured invite code.</span
          >
        </div>
        <article class="card onboarding-card">
          <div class="auth-mode-switch" role="tablist" aria-label="Authentication mode">
            <button type="button" id="admin-mode-login" class="auth-mode-btn active" aria-selected="true">Sign in</button>
            <button type="button" id="admin-mode-signup" class="auth-mode-btn" aria-selected="false">
              Create account
            </button>
          </div>
          <p id="admin-auth-feedback" class="auth-feedback hidden" role="alert"></p>
          <form id="admin-auth-form">
            <label id="admin-name-label" class="hidden">
              Full name
              <input id="admin-input-name" type="text" placeholder="Alex Morgan" />
            </label>
            <label id="admin-code-label" class="hidden">
              Invite code
              <input id="admin-input-code" type="password" autocomplete="off" placeholder="From platform operator" />
            </label>
            <label>
              Email
              <input id="admin-input-email" type="email" required autocomplete="username" placeholder="you@example.com" />
            </label>
            <label>
              Password
              <input
                id="admin-input-password"
                type="password"
                required
                minlength="8"
                autocomplete="current-password"
                placeholder="At least 8 characters"
              />
            </label>
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary" id="admin-submit-btn">Sign in</button>
            </div>
          </form>
        </article>
      </section>
    </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/admin-signin.js"></script>
  </body>
</html>
